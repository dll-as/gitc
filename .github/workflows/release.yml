name: Create Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build all binaries
        run: |
          mkdir -p ./build

          GOOS=linux GOARCH=amd64 go build -o ./build/gitc-linux-amd64 ./cmd
          GOOS=linux GOARCH=arm64 go build -o ./build/gitc-linux-arm64 ./cmd

          # macOS
          GOOS=darwin GOARCH=amd64 go build -o ./build/gitc-darwin-amd64 ./cmd
          GOOS=darwin GOARCH=arm64 go build -o ./build/gitc-darwin-arm64 ./cmd

          # Windows
          GOOS=windows GOARCH=amd64 go build -o ./build/gitc-windows-amd64.exe ./cmd

          ls -la ./build/

      - name: Create checksums
        run: |
          cd ./build
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            ./build/*
          generate_release_notes: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}